<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运营业务管理系统</title>
  <style>
    :root {
      --bg: #f4f6f9;
      --panel: #ffffff;
      --ink: #172033;
      --muted: #667085;
      --line: #dce3ee;
      --brand: #2563eb;
      --brand-dark: #1d4ed8;
      --green: #0f9f6e;
      --amber: #d97706;
      --red: #dc2626;
      --blue-soft: #eaf2ff;
      --shadow: 0 18px 42px -28px rgba(23, 32, 51, .45);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .login-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(135deg, rgba(37, 99, 235, .12), transparent 42%),
        linear-gradient(315deg, rgba(15, 159, 110, .12), transparent 42%),
        var(--bg);
    }

    .login-card {
      width: min(420px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .login-card h1 { margin: 0; font-size: 24px; }
    .login-card p { margin: 8px 0 22px; color: var(--muted); font-size: 14px; }

    .app-shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 64px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 220px;
    }

    .logo {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--ink);
      color: #fff;
      font-weight: 800;
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 17px; }
    .subtle { color: var(--muted); font-size: 12px; margin-top: 3px; }

    .tabs {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .tab {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #344054;
      padding: 0 13px;
      font-weight: 700;
    }

    .tab.active {
      color: #fff;
      background: var(--brand);
      border-color: var(--brand);
    }

    .workspace {
      display: grid;
      grid-template-columns: 260px minmax(560px, 1fr) 370px;
      min-height: 0;
    }

    .sidebar, .editor {
      background: var(--panel);
      border-color: var(--line);
      padding: 20px;
      min-height: calc(100vh - 64px);
    }

    .sidebar {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .editor {
      border-left: 1px solid var(--line);
      overflow-y: auto;
      max-height: calc(100vh - 64px);
    }

    .search {
      height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #f8fafc;
    }

    .search input {
      border: 0;
      outline: 0;
      background: transparent;
      min-width: 0;
      width: 100%;
      color: var(--ink);
    }

    .filters, .mini-list { display: grid; gap: 8px; }
    .mini-list { overflow: auto; padding-right: 2px; }

    .filter, .person-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #344054;
    }

    .filter {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 11px;
    }

    .filter.active {
      color: #fff;
      background: var(--ink);
      border-color: var(--ink);
    }

    .person-card {
      padding: 11px;
      text-align: left;
    }

    .person-card.active {
      border-color: #9bb8ff;
      box-shadow: inset 3px 0 0 var(--brand);
    }

    .person-card b {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .main {
      min-width: 0;
      padding: 22px;
      overflow: auto;
      max-height: calc(100vh - 64px);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .toolbar h2 {
      font-size: 22px;
      letter-spacing: 0;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: #344054;
      padding: 0 13px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
    }

    .btn.primary {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
    }

    .btn.primary:hover { background: var(--brand-dark); }
    .btn.danger { color: var(--red); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .stat b {
      display: block;
      font-size: 24px;
      margin-top: 8px;
      letter-spacing: 0;
    }

    .table-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: auto;
      box-shadow: var(--shadow);
    }

    .map-view {
      position: relative;
      min-height: 560px;
      background: #eef2f7;
      overflow: hidden;
    }

    .map-canvas {
      position: absolute;
      inset: 0;
    }

    .map-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .map-node {
      position: absolute;
      transform: translate(-50%, -50%);
      border: 0;
      background: transparent;
      display: grid;
      justify-items: center;
      gap: 5px;
      z-index: 2;
    }

    .map-pin {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: #fff;
      display: grid;
      place-items: center;
      border: 3px solid #fff;
      font-weight: 800;
      box-shadow: 0 8px 18px -10px rgba(23, 32, 51, .75);
      background: var(--pin);
    }

    .map-node.active .map-pin {
      box-shadow: 0 0 0 5px rgba(37, 99, 235, .18), 0 10px 22px -10px rgba(23, 32, 51, .7);
      transform: scale(1.12);
    }

    .map-label {
      font-size: 12px;
      font-weight: 700;
      color: #24304a;
      background: rgba(255, 255, 255, .95);
      border: 1px solid rgba(23, 32, 51, .08);
      border-radius: 6px;
      padding: 3px 8px;
      white-space: nowrap;
      box-shadow: 0 6px 18px -14px rgba(23, 32, 51, .75);
    }

    .map-node.active .map-label {
      background: var(--ink);
      color: #fff;
      border-color: var(--ink);
    }

    .map-card {
      position: absolute;
      right: 18px;
      top: 18px;
      width: min(330px, calc(100% - 36px));
      background: rgba(255, 255, 255, .96);
      border: 1px solid rgba(23, 32, 51, .08);
      border-radius: 8px;
      padding: 15px;
      box-shadow: var(--shadow);
      z-index: 3;
    }

    .map-card h3 {
      font-size: 17px;
      margin-bottom: 8px;
    }

    .map-card dl {
      display: grid;
      grid-template-columns: 86px 1fr;
      gap: 8px 10px;
      margin: 12px 0 0;
      font-size: 13px;
    }

    .map-card dt {
      color: var(--muted);
      font-weight: 700;
    }

    .map-card dd {
      margin: 0;
      min-width: 0;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    th, td {
      padding: 12px 13px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      font-size: 13px;
      line-height: 1.45;
    }

    th {
      color: #fff;
      font-size: 12px;
      background: #7f9bd2;
      position: sticky;
      top: 0;
      z-index: 1;
      white-space: nowrap;
    }

    tr:last-child td { border-bottom: 0; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f8fbff; }
    tbody tr.selected { background: #eef5ff; }

    .status {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 0 9px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.active, .status.settled, .status.normal { color: var(--green); background: #e8f7f0; }
    .status.trial, .status.pending { color: var(--amber); background: #fff5df; }
    .status.inactive, .status.unsettled { color: var(--red); background: #ffecec; }
    .status.resolved, .status.low { color: var(--green); background: #e8f7f0; }
    .status.doing, .status.medium { color: var(--amber); background: #fff5df; }
    .status.open, .status.high { color: var(--red); background: #ffecec; }
    .status.won { color: var(--green); background: #e8f7f0; }
    .status.lead, .status.contacted, .status.negotiating { color: var(--amber); background: #fff5df; }
    .status.lost { color: var(--red); background: #ffecec; }

    .progress {
      height: 8px;
      background: #e9edf4;
      border-radius: 99px;
      overflow: hidden;
      min-width: 86px;
    }

    .progress i {
      display: block;
      height: 100%;
      background: #0f766e;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .form { display: grid; gap: 13px; }

    label {
      display: grid;
      gap: 6px;
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 40px;
      padding: 8px 10px;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 82px;
    }

    .two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .hint {
      border: 1px solid #cfe1ff;
      background: var(--blue-soft);
      color: #305085;
      border-radius: 8px;
      padding: 11px;
      font-size: 13px;
      line-height: 1.55;
    }

    .empty {
      padding: 34px;
      text-align: center;
      color: var(--muted);
    }

    .error {
      color: var(--red);
      font-size: 13px;
      min-height: 18px;
    }

    @media (max-width: 1220px) {
      .workspace { grid-template-columns: 240px 1fr; }
      .editor {
        grid-column: 1 / -1;
        border-left: 0;
        border-top: 1px solid var(--line);
        max-height: none;
        min-height: auto;
      }
    }

    @media (max-width: 820px) {
      .topbar { align-items: flex-start; flex-direction: column; padding: 14px; }
      .workspace { display: block; }
      .sidebar, .main, .editor { max-height: none; min-height: auto; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .toolbar { align-items: flex-start; flex-direction: column; }
      .two { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <section class="login-page" id="loginPage">
    <form class="login-card" id="loginForm">
      <h1>运营业务管理系统</h1>
      <p>登录后管理业务人员、采集人员、合作渠道和合作商信息。</p>
      <label>账号
        <input id="loginUser" autocomplete="username" required placeholder="admin">
      </label>
      <br>
      <label>密码
        <input id="loginPass" type="password" autocomplete="current-password" required placeholder="123456">
      </label>
      <p class="error" id="loginError"></p>
      <button class="btn primary" type="submit">登录</button>
      <p class="subtle">默认账号：admin，密码：123456</p>
    </form>
  </section>

  <section class="app-shell" id="appShell" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="logo">运</div>
        <div>
          <h1>运营业务管理系统</h1>
          <p class="subtle">人员、采集、渠道、合作商台账</p>
        </div>
      </div>
      <nav class="tabs" id="moduleTabs"></nav>
      <button class="btn" id="logoutBtn" type="button">退出登录</button>
    </header>

    <div class="workspace">
      <aside class="sidebar">
        <div class="search">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" placeholder="搜索当前模块">
        </div>
        <div class="filters" id="filters"></div>
        <div class="mini-list" id="miniList"></div>
      </aside>

      <main class="main">
        <div class="toolbar">
          <div>
            <h2 id="moduleTitle"></h2>
            <p class="subtle" id="moduleDesc"></p>
          </div>
          <div class="actions">
            <button class="btn" id="importBtn" type="button">⇧ 导入 CSV</button>
            <button class="btn" id="exportBtn" type="button">⇩ 导出 CSV</button>
            <button class="btn primary" id="newBtn" type="button">＋ 新增</button>
            <input id="importFile" type="file" accept=".csv,text/csv" hidden>
          </div>
        </div>

        <section class="stats" id="stats"></section>
        <section class="table-wrap">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
          <div class="map-view" id="mapView" hidden></div>
          <div class="empty" id="emptyState" hidden>没有匹配的记录</div>
        </section>
      </main>

      <aside class="editor">
        <div class="section-title">
          <div>
            <h3 id="formTitle"></h3>
            <p class="subtle" id="formSubtitle"></p>
          </div>
        </div>
        <form class="form" id="recordForm"></form>
      </aside>
    </div>
  </section>

  <script src="./ops-core.js"></script>
  <script src="./app.js"></script>
</body>
</html>
